<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Closing Kas Konter</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6eb;--pr:#0b5ed7;--ok:#168a45;--no:#c8312b;--wa:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#98a2b3;--bd:#2a323d;--pr:#5b9bff;--ok:#4cc27f;--no:#ff7a72;--wa:#f0a73a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:auto;padding:12px 12px 80px}
h1{font-size:18px;margin:4px 0}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tabs button,.seg button{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;font-size:14px}
.tabs .on,.seg .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.seg{display:flex;gap:6px;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font-size:16px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:15px;font-weight:600;margin-top:10px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.row.b{font-weight:700;border-top:1px solid var(--bd);margin-top:4px;padding-top:8px}
.m{color:var(--mut)}.ok{color:var(--ok)}.no{color:var(--no)}.wa{color:var(--wa)}
.tx{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.pill{padding:10px;border-radius:10px;text-align:center;font-weight:700;margin-top:8px;border:1px solid}
.den{display:grid;grid-template-columns:1fr 90px;gap:6px;align-items:center;margin:4px 0}
.x{background:none;border:0;color:var(--no);font-size:18px}img.th{width:44px;height:44px;object-fit:cover;border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<h1>💰 Closing Kas Konter</h1><div id="who" class="m" style="font-size:12px"></div>
<input type="date" id="dt" style="margin-bottom:4px">
<div class="tabs"><button data-t="tx" class="on">Transaksi</button><button data-t="cl">Closing</button><button data-t="st">Stok</button><button data-t="rw">Riwayat</button></div>
<div id="v"></div>
<script>
const PJ="Pinjam Ibu/Tigaraksa",isIbu=x=>x.k==="transfer"&&(x.r==="ibu"||x.s===PJ),isPusat=x=>x.k==="transfer"&&x.r==="pusat",isRb=x=>isRb(x)&&!isPusat(x);
const R=n=>(n<0?"-":"")+"Rp"+Math.abs(Math.round(n)).toLocaleString("id-ID"),$=s=>document.querySelector(s);
const num=s=>parseInt(String(s||"").replace(/\D/g,""))||0;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let S={tx:[],open:{},close:{},stok:{}},draft=null,scanMsg="",tab="tx",kind="transfer",photo="",editId=null,fill=false;
let user=null;try{user=localStorage.getItem("konter_user")}catch(e){}
function toast(m){const t=document.createElement("div");t.textContent=m;t.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:536px;margin:auto;background:var(--tx);color:var(--bg);padding:12px;border-radius:10px;z-index:99;text-align:center";document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function ask(m,yes){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98;display:flex;align-items:center;justify-content:center;padding:20px";o.innerHTML='<div class="card" style="max-width:360px;width:100%"><p style="margin:0 0 4px"></p><div class="two"><button class="btn g" id="aN">Batal</button><button class="btn" id="aY">Ya, lanjut</button></div></div>';o.querySelector("p").textContent=m;document.body.appendChild(o);o.querySelector("#aN").onclick=()=>o.remove();o.querySelector("#aY").onclick=()=>{o.remove();yes()}}
function who(){const w=$("#who");w.textContent="👤 "+user+" ";const b=document.createElement("button");b.textContent="Keluar";b.className="x";b.style.cssText="font-size:12px;color:var(--pr)";b.onclick=()=>{user=null;try{localStorage.removeItem("konter_user")}catch(e){}draw()};w.appendChild(b)}
try{S=Object.assign(S,JSON.parse(localStorage.getItem("konter")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("konter",JSON.stringify(S))}catch(e){toast("Penyimpanan penuh/tidak tersedia. Hapus foto lama.")}};
const D=()=>$("#dt").value;$("#dt").value=today();$("#dt").onchange=()=>{draft=null;scanMsg="";draw()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));draw()});

function calc(d){const t=S.tx.filter(x=>x.d===d),o=S.open[d]||{kas:0,saldo:0};let pus=0,pj=0,ci=0,co=0,sd=0,ns=0,cs=0,tf=0,tk=0,nofoto=0,fee=0;
t.forEach(x=>{if(isPusat(x)){sd+=x.n;pus+=x.n}else if(isIbu(x)){ci+=x.n+x.f;pj+=x.n}else if(x.k==="transfer"){ci+=x.n+x.f;sd-=x.n;tf+=x.n;fee+=x.f}
else if(x.k==="tarik"){co+=x.n;tk+=x.n;fee+=x.f;if(!x.p)nofoto++}
else if(x.m==="cash"){ci+=x.n;cs+=x.n}else{ns+=x.n}});
return{t,o,ci,co,sd,ns,cs,tf,tk,nofoto,fee,kas:o.kas+ci-co,pinjam:pj,pus,saldo:o.saldo+sd}}

function draw(){if(!user){$("#who").textContent="";$("#v").innerHTML='<div class="card"><h2>Masuk karyawan</h2><label>Nama</label><input id="un" placeholder="Nama kamu"><label>PIN</label><input id="up" type="password" inputmode="numeric" placeholder="PIN"><button class="btn" id="lg">Masuk</button></div>';$("#lg").onclick=()=>{const n=$("#un").value.trim();if(!n)return toast("Isi nama dulu");if($("#up").value!=="1234")return toast("PIN salah");user=n;try{localStorage.setItem("konter_user",n)}catch(e){}draw()};return}
const d=D();$("#v").innerHTML=tab==="tx"?vTx(d):tab==="cl"?vCl(d):tab==="st"?vSt(d):vRw();who();bind()}

function vOpen(d){if(S.open[d])return"";const ks=Object.keys(S.close).sort().filter(k=>k<d).pop(),c=ks?S.close[ks]:{};
return`<div class="card"><h2>Buka hari ini</h2><div class="two"><div><label>Uang modal</label><input id="ok" inputmode="numeric" class="rp" value="${c.besok?c.besok.toLocaleString("id-ID"):""}"></div><div><label>Saldo Rainbow awal</label><input id="os" inputmode="numeric" class="rp" value="${c.saldoAkhir?c.saldoAkhir.toLocaleString("id-ID"):""}"></div></div><button class="btn" id="bo">Mulai hari</button></div>`}

function vTx(d){const c=calc(d);if(!S.open[d])return vOpen(d);
const jual=kind==="jual";
return`<div class="card"><div class="seg"><button data-k="transfer" class="${kind==="transfer"?"on":""}">Transfer</button><button data-k="tarik" class="${kind==="tarik"?"on":""}">Tarik Tunai</button><button data-k="jual" class="${jual?"on":""}">Penjualan</button></div>
<p class="m" style="margin:0;font-size:12px">${kind==="transfer"?"Customer kasih cash, kita transfer dari saldo. Kas bertambah, saldo berkurang.":kind==="tarik"?"Customer transfer ke rekening toko, kita kasih cash. Wajib foto bukti.":"Pulsa, data, aksesoris, service HP. Bayar cash atau TF/QRIS."}</p>
${jual?"":`<div class="card" style="margin:8px 0;padding:8px;font-size:12px">📌 Isi transaksi = <b>akumulasi total sehari</b>. Contoh: hari ini 5 TF bank total Rp3.000.000 (sudah termasuk admin) → isi Jumlah 5, Total nominal 3.000.000. Boleh juga isi satuan (Jumlah 1).</div>`}
${kind==="transfer"?`<label>Sumber saldo</label><select id="sr"><option value="rainbow">Rainbow</option><option value="ibu">TF dari Ibu/Tigaraksa</option><option value="pusat">Tambah saldo Rainbow dari pusat</option></select><div class="m" style="font-size:12px;margin-top:4px">📌 TF dari Ibu/Tigaraksa: lihat di WA</div><div id="jw"><label>Jenis</label><select id="sb"><option>TF Bank</option><option>Top up DANA</option><option>Token listrik</option></select></div>`:""}
${jual?"":`<label>Jumlah transaksi</label><input id="j" class="rp" inputmode="numeric" value="1">`}
${jual?`<label>Kategori</label><select id="cat"><option>Pulsa</option><option>Paket Data</option><option>Aksesoris HP</option><option>Service HP</option><option>Lainnya</option></select><label>Pembayaran</label><select id="mt"><option value="cash">Cash</option><option value="tf">TF / QRIS (masuk rekening toko)</option></select>`:""}
<label>${kind==="tarik"?"Total nominal tarik tunai (sudah termasuk admin)":jual?"Nominal":"Total nominal transfer (sudah termasuk admin)"}</label><input id="n" class="rp" inputmode="numeric" placeholder="0">
<label>Catatan (nama / no. tujuan)</label><input id="ct" placeholder="opsional">
${kind==="tarik"?`<label>Foto bukti transfer masuk</label><input type="file" id="ph" accept="image/*" capture="environment">${photo?`<img class="th" src="${photo}" style="margin-top:6px">`:""}`:""}
<button class="btn" id="add">${editId?"Simpan perubahan":"Simpan transaksi"}</button>${editId?'<button class="btn g" id="cn">Batal edit</button>':""}</div>
<div class="card"><h2>Hari ini (${c.t.length})</h2>${c.t.length?c.t.slice().reverse().map(x=>`<div class="tx"><div><b>${x.k==="transfer"?"Transfer"+(x.s&&x.s!==PJ?" · "+x.s:"")+(isIbu(x)?" · via Ibu/Tigaraksa":"")+(x.r==="pusat"?" · tambah saldo dari pusat":""):x.k==="tarik"?"Tarik Tunai":x.c}</b> <span class="tag">${x.k==="jual"?(x.m==="cash"?"cash":"TF/QRIS"):x.k==="tarik"?(x.p?"📷 ada bukti":"⚠️ tanpa bukti"):(isIbu(x)?"cash, saldo Ibu":x.r==="pusat"?"saldo masuk":"cash")}</span><div class="m" style="font-size:12px">${x.t}${x.by?" · "+x.by:""} ${x.ct||""}${x.j>1?" · "+x.j+" trx":""}${x.f?" · fee "+R(x.f):""}</div></div><div style="text-align:right">${x.p?`<img class="th" src="${x.p}"><br>`:""}<b>${R(x.n)}</b><br><button class="x" data-ed="${x.id}" style="color:var(--pr)">✎</button> <button class="x" data-del="${x.id}">✕</button></div></div>`).join(""):'<p class="m">Belum ada transaksi.</p>'}</div>`}

function vCl(d){const c=calc(d);if(!S.open[d])return vOpen(d);const cl=S.close[d]||{};
const rk=f=>{const a=c.t.filter(f);return{n:a.reduce((s,x)=>s+(x.j||1),0),t:a.reduce((s,x)=>s+x.n,0),f:a.reduce((s,x)=>s+x.f,0)}};
const rw=(l,r)=>`<div class="row"><span>${l}<br><span class="m" style="font-size:12px">${r.n} transaksi${r.f?" · fee "+R(r.f):""}</span></span><b>${R(r.t)}</b></div>`;
const dens=[100000,50000,20000,10000,5000,2000,1000],cnt=cl.cnt||{};
return`<div class="card"><h2>Rekap transaksi hari ini</h2>${rw("Transfer",rk(x=>isRb(x)))}${["TF Bank","Top up DANA","Token listrik"].map(s=>{const r=rk(x=>isRb(x)&&(x.s||"TF Bank")===s);return r.n?rw("&nbsp;&nbsp;↳ "+s,r):""}).join("")}${(()=>{const r=rk(isIbu);return r.n?rw("TF via saldo Ibu/Tigaraksa (cash disetor ke Ibu, lihat di WA)",r):""})()}${(()=>{const r=rk(isPusat);return r.n?rw("Tambah saldo Rainbow dari pusat",r):""})()}${rw("Tarik tunai",rk(x=>x.k==="tarik"))}${rw("Penjualan cash",rk(x=>x.k==="jual"&&x.m==="cash"))}${rw("Penjualan TF/QRIS",rk(x=>x.k==="jual"&&x.m!=="cash"))}</div>
<div class="card"><h2>Ringkasan kas fisik</h2>
<div class="row"><span>Uang modal</span><span>${R(c.o.kas)}</span></div>
<div class="row"><span class="m">+ Cash transfer</span><span class="ok">${R(c.ci-c.cs)}</span></div>
<div class="row"><span class="m">+ Penjualan cash</span><span class="ok">${R(c.cs)}</span></div>
<div class="row"><span class="m">− Tarik tunai (cash keluar)</span><span class="no">${R(c.co)}</span></div>
<div class="row b"><span>Kas seharusnya</span><span>${R(c.kas)}</span></div></div>
<div class="card"><h2>Hitung uang fisik</h2>${dens.map(v=>`<div class="den"><span>${R(v)} ×</span><input class="dn" data-v="${v}" inputmode="numeric" value="${cnt[v]||""}" placeholder="0"></div>`).join("")}
<div class="den"><span>Receh / lainnya</span><input id="rc" class="rp" inputmode="numeric" value="${cl.receh?cl.receh.toLocaleString("id-ID"):""}" placeholder="0"></div>
<div class="row b"><span>Kas fisik</span><span id="fis">-</span></div><div id="sel1"></div></div>
<div class="card"><h2>Cek saldo Rainbow</h2><p class="m" style="margin:0 0 6px;font-size:12px">ℹ️ Saldo Rainbow = khusus TF bank, top up DANA, token listrik. Saldo Digital Chip (khusus inject voucher paket/pulsa) dicatat terpisah di tab Stok.</p>
<div class="row"><span>Saldo awal</span><span>${R(c.o.saldo)}</span></div>
<div class="row"><span class="m">− Transfer keluar</span><span class="no">${R(c.tf)}</span></div>
<div class="row"><span class="m">+ Tambah saldo dari pusat</span><span class="ok">${R(c.pus)}</span></div>
<div class="row b"><span>Saldo seharusnya</span><span>${R(c.saldo)}</span></div>${c.saldo<0?`<div class="pill no">⚠️ Saldo Rainbow minus. Ada tambahan saldo dari pusat yang belum dicatat?</div>`:""}
<label>Saldo Rainbow aktual (cek di aplikasi)</label><input id="sa" class="rp" inputmode="numeric" value="${cl.saldoAkhir?cl.saldoAkhir.toLocaleString("id-ID"):""}"><div id="sel2"></div>
<p class="m" style="font-size:12px">Selisih saldo bisa dari biaya admin bank atau transaksi belum dicatat.</p></div>
<div class="card"><h2>Setoran</h2>${c.nofoto?`<p class="wa">⚠️ ${c.nofoto} tarik tunai belum ada foto bukti.</p>`:""}
<label>Modal kas untuk besok</label><input id="bs" class="rp" inputmode="numeric" value="${cl.besok?cl.besok.toLocaleString("id-ID"):""}">
<div class="row b"><span>Cash disetor</span><span id="stor">-</span></div>
${c.tk?`<div class="row"><span class="m">+ Masuk rekening lewat tarik tunai</span><span>${R(c.tk)}</span></div><div class="row b"><span>Total setoran</span><span id="tot">-</span></div>`:""}
<button class="btn" id="sv">${S.close[d]?"Perbarui closing":"Simpan closing"}</button><button class="btn g" id="wa">📲 Kirim laporan ke WhatsApp</button></div>`}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1800/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>b?ok(b):no(new Error("img")),"image/jpeg",.88)};im.onerror=no;im.src=URL.createObjectURL(f)})}
const KT=["Kartu Telkomsel","Kartu XL","Kartu Indosat","Kartu Smartfren","Kartu Axis","Kartu Tri","Perdana TSEL","Perdana BYU","Perdana Indosat","Perdana Tri","Perdana Axis","Perdana XL","Perdana Smartfren"];
const PK={Telkomsel:[["4GB/1 HARI",9500],["4GB/5 HARI",16000],["6GB/2 HARI",14000],["6GB/5 HARI",19000],["7GB/30 HARI",38000],["10GB/30 HARI",48000],["18GB/30 HARI",58000]],XL:[["3GB/1 HARI",10000],["4,5GB/3 HARI",17000],["4GB/7 HARI",20000],["6GB/7 HARI",25000],["6,5GB/15 HARI",45000],["10GB/30 HARI",55000]],Indosat:[["1,5GB/1 HARI",9500],["6GB/2 HARI",13500],["5GB/5 HARI",19000],["9GB/5 HARI",20000],["7GB/30 HARI",36000],["16GB/30 HARI",50000],["5,5GB/3 HARI",14000],["6GB/3 HARI",16000],["10GB/5 HARI",22000],["15GB/7 HARI",28000],["10GB/30 HARI",42000],["18GB/30 HARI",55000]],Smartfren:[["1GB/1 HARI",10000],["4GB/3 HARI",13500],["6GB/7 HARI",20000],["UNLI 7 HARI",28000],["11GB/30 HARI",50000],["UNLI 28 HARI",88000]],Axis:[["6GB/1 HARI",10000],["3GB/3 HARI",12500],["3,5GB/5 HARI",16000],["16GB/5 HARI",28000],["3GB/7 HARI",18000],["10GB/30 HARI",43000],["26GB/30 HARI",67000],["35GB/30 HARI",80000]],Tri:[["2,5GB/1 HARI",10000],["6GB/2 HARI",13000],["6GB/2 HARI",20000],["3,5GB/3 HARI",15000],["20GB/3 HARI",22000],["7GB/5 HARI",25000],["10GB/7 HARI",28000],["15GB/7 HARI",35000],["75GB/7 HARI",52000],["16GB/10 HARI",50000],["65GB/28 HARI",100000],["150GB/28 HARI",150000]]};
const UK=[["modalSaldo","U. Modal Saldo"],["modal","U. Modal"],["aksesoris","U. Aksesoris"],["digipos","Stk Saldo Digipos"],["simpel","Stk Saldo Simpel"],["rita","Stk Saldo Rita"],["rainbow","Stk Saldo Rainbow"],["dana","Stk Saldo Dana"],["digitalChip","Stk Saldo Digital Chip"],["brilink","Stk Saldo BRI-Link"],["tfIbu","TF LWT Ibu"],["mintaTgr","Minta ke TGR"],["setoran","Uang Setoran"]];
const pkey=(o,p)=>o+"|"+p[0]+"|"+p[1],nz=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
const PROMPT="Ini foto kertas closing stok harian konter pulsa: formulir cetak yang diisi tulisan tangan. Baca HANYA yang ditulis tangan, abaikan teks cetak dan coretan samar di balik kertas. Balas HANYA JSON: {\"tgl\":\"YYYY-MM-DD\",\"k\":{...},\"p\":[...],\"u\":{...}}. \"k\": untuk tiap kunci berikut isi array [AWL,TMBHN,TJL,AKR] dari kolom bertulisan itu. Kunci 'Kartu X' = baris 'Kartu kosong' pada kotak operator X; kunci 'Perdana X' = baris operator itu di tabel PERDANA KUOTA. Kunci persis: "+KT.join(" | ")+". Kolom kosong = 0. \"p\": hanya baris paket data yang kolom Jml Jl-nya terisi tulisan tangan, bentuk {\"op\":\"Telkomsel|XL|Indosat|Smartfren|Axis|Tri\",\"paket\":\"teks paket persis di kertas, mis. 4GB/1 HARI/Rp9.500\",\"jml\":angka}. \"u\": kotak uang kanan bawah, angka rupiah tanpa titik, kosong = 0, kunci: "+UK.map(x=>x[0]).join(", ")+". Jangan menebak tulisan yang tidak jelas: isi 0.";
function getKey(){try{return localStorage.getItem("konter_key")||""}catch(e){return ""}}
function parseJ(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)return null;try{return JSON.parse(t.slice(a,b+1))}catch(e){return null}}
const b64=bl=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(bl)});
async function askImg(blob){let sp=null;try{if(typeof claude!=="undefined")sp=await claude.use("sample")}catch(e){}
if(sp){try{return await sp.json(PROMPT,{images:[blob],modelTier:"default"})}catch(e){if(e.code==="invalid_json"&&e.text){const j=parseJ(e.text);if(j)return j}if(!getKey()||["rate_limited","refused","empty_completion","image_rejected","invalid_json","upstream_error","prompt_too_large"].includes(e.code))throw e}}
const key=getKey();if(!key)throw{code:"no_key"};
const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:3000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:await b64(blob)}},{type:"text",text:PROMPT}]}]})});
const j=await res.json();if(!res.ok)throw{code:"api",message:"API: "+((j.error&&j.error.message)||res.status)};
const out=parseJ((j.content||[]).map(x=>x.text||"").join(""));if(!out)throw{code:"invalid_json"};return out}
function errMsg(e){return e.code==="no_key"?"Scan belum aktif di sini. Buka lewat aplikasi Claude, atau isi kunci API di Pengaturan scan di bawah.":e.code==="not_granted"?"Izin ditolak. Izinkan Claude agar scan bisa jalan.":e.code==="api"?e.message:"Gagal membaca foto ("+(e.code||e.message||"error")+"). Coba foto ulang yang lebih terang."}
function newDraft(){const k={};KT.forEach(n=>k[n]=[0,0,0,0]);return{k,p:{},u:{}}}
function prevK(d){const x=Object.keys(S.stok).sort().filter(y=>y<d&&S.stok[y].k).pop();return x?S.stok[x].k:{}}
function kwarn(n,r,pv){const w=[],sold=r[0]+r[1]-r[3];if(r[3]>r[0]+r[1])w.push("Akhir lebih besar dari awal + tambahan");if(r[2]&&r[2]!==sold)w.push("Terjual tertulis "+r[2]+", hitungan "+sold);if(pv[n]&&pv[n][3]!==r[0])w.push("Awal "+r[0]+", tapi akhir kemarin "+pv[n][3]);return w}
function pTot(o){let n=0,t=0;PK[o].forEach(p=>{const j=draft.p[pkey(o,p)]||0;n+=j;t+=j*p[1]});return[n,t]}
function redraw(){const y=scrollY,o=[...document.querySelectorAll("details[open]")].map(x=>x.dataset.o);draw();o.forEach(n=>{const e=document.querySelector('details[data-o="'+n+'"]');if(e)e.open=true});scrollTo(0,y)}
function vSt(d){if(!draft||!draft.k){const s=S.stok[d];draft=s&&s.k?JSON.parse(JSON.stringify({k:s.k,p:s.p||{},u:s.u||{}})):newDraft()}
const pv=prevK(d),cl=S.close[d];let bad=0;
const kr=KT.map(n=>{const r=draft.k[n],w=kwarn(n,r,pv);if(w.length)bad++;return`<div style="padding:7px 0;border-bottom:1px solid var(--bd)"><b style="font-size:13px">${n}</b> <span class="m" style="font-size:12px">terjual ${Math.max(0,r[0]+r[1]-r[3])}</span><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${["Awal","Tambah","Tjl","Akhir"].map((l,i)=>`<div><label style="margin:2px 0">${l}</label><input class="kk" inputmode="numeric" data-n="${n}" data-i="${i}" value="${r[i]||""}" placeholder="0"></div>`).join("")}</div>${w.map(x=>`<div class="wa" style="font-size:12px">⚠️ ${x}</div>`).join("")}</div>`}).join("");
let aj=0,at=0;const pk=Object.keys(PK).map(o=>{const[t,tt]=pTot(o);aj+=t;at+=tt;return`<details data-o="${o}" style="border-bottom:1px solid var(--bd);padding:6px 0"><summary><b>${o}</b> <span class="m" style="font-size:12px">${t} terjual · ${R(tt)}</span></summary>${PK[o].map(p=>`<div class="row" style="align-items:center"><span style="font-size:13px">${p[0]} <span class="m">${R(p[1])}</span></span><input class="kp" style="width:70px" inputmode="numeric" data-k="${pkey(o,p)}" value="${draft.p[pkey(o,p)]||""}" placeholder="0"></div>`).join("")}</details>`}).join("");
const H={rainbow:"TF bank, top up DANA, token listrik",digitalChip:"khusus inject voucher paket/pulsa"};
const uk=UK.map(([k,l])=>`<div><label>${l}${H[k]?`<br><span style="font-size:11px">(${H[k]})</span>`:""}</label><input class="ku rp" inputmode="numeric" data-k="${k}" value="${draft.u[k]?draft.u[k].toLocaleString("id-ID"):""}" placeholder="0"></div>`).join("");
const cm=[];if(draft.u.setoran){if(!cl)cm.push(["wa","Closing kas hari ini belum disimpan, setoran belum bisa dicocokkan."]);else if(cl.setor!==draft.u.setoran)cm.push(["no","⚠️ Setoran kertas "+R(draft.u.setoran)+" beda dengan closing app "+R(cl.setor)+" (selisih "+R(draft.u.setoran-cl.setor)+")"]);else cm.push(["ok","✓ Setoran kertas sama dengan closing app"])}
if(draft.u.rainbow&&cl&&cl.saldoAkhir&&cl.saldoAkhir!==draft.u.rainbow)cm.push(["no","⚠️ Saldo Rainbow kertas "+R(draft.u.rainbow)+" beda dengan saldo aktual closing "+R(cl.saldoAkhir)]);
return`<div class="card"><h2>Scan kertas closing stok</h2><p class="m" style="margin:0;font-size:12px">Foto seluruh kertas (lurus, terang). Claude membaca tulisan tangan, lalu kamu cek hasilnya.</p><input type="file" id="sc" accept="image/*" style="margin-top:8px"><div class="m sm" style="margin-top:6px">${scanMsg}</div><details style="margin-top:8px"><summary class="m" style="font-size:12px">Pengaturan scan (kunci API)</summary><p class="m" style="font-size:12px">Hanya perlu kalau halaman dibuka di luar aplikasi Claude (misalnya lewat GitHub). Buat kunci di console.anthropic.com, pasang batas biaya, lalu tempel di sini. Tersimpan hanya di HP ini.</p><input id="ak" type="password" placeholder="sk-ant-..." value="${esc(getKey())}"><button class="btn g" id="aks">Simpan kunci</button></details></div>
<div class="card"><h2>Kartu kosong &amp; perdana kuota</h2>${kr}${bad?`<div class="pill wa">⚠️ ${bad} baris perlu dicek</div>`:`<div class="pill ok">✓ Semua hitungan cocok</div>`}</div>
<div class="card"><h2>Paket data terjual</h2>${pk}<div class="row b"><span>Total semua paket (${aj})</span><span>${R(at)}</span></div></div>
<div class="card"><h2>Uang &amp; saldo</h2><div class="two">${uk}</div>${cm.map(x=>`<div class="${x[0]}" style="margin-top:8px">${x[1]}</div>`).join("")}</div>
<button class="btn" id="ss">Simpan stok</button>${S.stok[d]?`<p class="m" style="font-size:12px;text-align:center">Tersimpan oleh ${esc(S.stok[d].by||"-")} pukul ${S.stok[d].t||""}</p>`:""}`}
function vRw(){const ks=Object.keys(S.close).sort().reverse();return`<div class="card"><h2>Riwayat closing</h2>${ks.length?ks.map(k=>{const x=S.close[k];return`<div class="tx"><div><b>${k}</b><div class="m" style="font-size:12px">Kas seharusnya ${R(x.kasExp)}<br>Kas fisik ${R(x.fisik)}</div></div><div style="text-align:right"><b class="${x.sel===0?"ok":"no"}">${x.sel===0?"Pas ✓":"Selisih "+R(x.sel)}</b><br><span class="m" style="font-size:12px">Setor ${R(x.setor)}</span></div></div>`}).join(""):'<p class="m">Belum ada closing.</p>'}</div>`}

function pill(id,s){const el=$(id);if(!el)return;el.innerHTML=s===0?`<div class="pill ok">✓ PAS, tidak ada selisih</div>`:`<div class="pill ${s<0?"no":"wa"}">${s<0?"KURANG":"LEBIH"} ${R(Math.abs(s))}</div>`}
function bind(){const d=D(),c=calc(d);
document.querySelectorAll(".rp").forEach(i=>i.oninput=()=>{const v=num(i.value);i.value=v?v.toLocaleString("id-ID"):"";upd()});
document.querySelectorAll(".dn,#sa").forEach(i=>i.oninput=upd);
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{if(editId)return toast("Selesaikan atau batalkan edit dulu");kind=b.dataset.k;photo="";draw()});
document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{const x=S.tx.find(y=>y.id==b.dataset.ed);if(!x)return;editId=x.id;kind=x.k;photo=x.p||"";fill=true;draw();window.scrollTo(0,0)});
const cn=$("#cn");if(cn)cn.onclick=()=>{editId=null;photo="";draw()};
if(fill&&editId){fill=false;const x=S.tx.find(y=>y.id===editId);if(x){$("#n").value=(x.n+(x.f||0)).toLocaleString("id-ID");if($("#f"))$("#f").value=x.f?x.f.toLocaleString("id-ID"):"";$("#ct").value=x.ct||"";if($("#j"))$("#j").value=x.j||1;if($("#sb"))$("#sb").value=x.s===PJ?"TF Bank":x.s||"TF Bank";if($("#sr"))$("#sr").value=x.r==="pusat"?"pusat":isIbu(x)?"ibu":"rainbow";if(x.k==="jual"){$("#cat").value=x.c;$("#mt").value=x.m}}}
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ask("Hapus transaksi ini?",()=>{S.tx=S.tx.filter(x=>x.id!=b.dataset.del);save();draw()})});
document.querySelectorAll(".kk").forEach(i=>i.onchange=()=>{draft.k[i.dataset.n][i.dataset.i]=num(i.value);redraw()});
document.querySelectorAll(".kp").forEach(i=>i.onchange=()=>{const v=num(i.value);if(v)draft.p[i.dataset.k]=v;else delete draft.p[i.dataset.k];redraw()});
document.querySelectorAll(".ku").forEach(i=>i.onchange=()=>{draft.u[i.dataset.k]=num(i.value);redraw()});
const ss=$("#ss");if(ss)ss.onclick=()=>{const bad=KT.filter(n=>kwarn(n,draft.k[n],prevK(d)).length).length;if(bad&&!ss.dataset.ok){ask(bad+" baris stok perlu dicek. Tetap simpan?",()=>{ss.dataset.ok=1;ss.onclick()});return}S.stok[d]={by:user,k:draft.k,p:draft.p,u:draft.u,t:new Date().toTimeString().slice(0,5)};save();scanMsg="✓ Stok tersimpan";draw()};
const aks=$("#aks");if(aks)aks.onclick=()=>{try{localStorage.setItem("konter_key",$("#ak").value.trim());toast("Kunci tersimpan")}catch(e){toast("Gagal menyimpan kunci")}};
const sc=$("#sc");if(sc)sc.onchange=async()=>{const f=sc.files[0];if(!f)return;sc.parentNode.querySelector(".sm").textContent="Memproses foto, bisa sampai 1 menit...";
try{const r=await askImg(await shrink(f));
const nd=newDraft();if(r.k)KT.forEach(n=>{const a=r.k[n];if(Array.isArray(a))nd.k[n]=[0,1,2,3].map(i=>num(a[i]))});
(r.p||[]).forEach(x=>{const o=Object.keys(PK).find(y=>nz(y)===nz(x.op)),p=o&&PK[o].find(q=>nz(q[0]+"RP"+q[1])===nz(x.paket));if(p)nd.p[pkey(o,p)]=num(x.jml)});
UK.forEach(([k])=>nd.u[k]=num((r.u||{})[k]));draft=nd;
scanMsg="✓ Terbaca. Cek dan koreksi dulu sebelum simpan."+(r.tgl&&r.tgl!==d?" ⚠️ Tanggal di kertas "+r.tgl+" beda dengan tanggal terpilih ("+d+").":"")}
catch(e){scanMsg=errMsg(e)}
draw()};
const sr=$("#sr");if(sr){const sh=()=>{$("#jw").style.display=sr.value==="pusat"?"none":"block"};sr.onchange=sh;sh()}
const bo=$("#bo");if(bo)bo.onclick=()=>{S.open[d]={kas:num($("#ok").value),saldo:num($("#os").value)};save();draw()};
const ph=$("#ph");if(ph)ph.onchange=()=>{const f=ph.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,520/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);photo=cv.toDataURL("image/jpeg",.55);const n=$("#n").value,f2=$("#f").value,ct=$("#ct").value;draw();$("#n").value=n;$("#f").value=f2;$("#ct").value=ct};im.src=URL.createObjectURL(f)};
const add=$("#add");if(add)add.onclick=()=>{const n=num($("#n").value);if(!n)return toast("Isi nominal dulu");
if(kind==="tarik"&&!photo&&!add.dataset.ok){ask("Belum ada foto bukti transfer. Tetap simpan?",()=>{add.dataset.ok=1;add.onclick()});return}
const x={id:Date.now(),d,k:kind,n,f:0,j:kind==="jual"?1:Math.max(1,num($("#j").value)),s:kind==="transfer"&&$("#sr").value!=="pusat"?$("#sb").value:"",r:kind==="transfer"?$("#sr").value:"",ct:$("#ct").value,t:new Date().toTimeString().slice(0,5),by:user};
if(kind==="jual"){x.c=$("#cat").value;x.m=$("#mt").value}if(kind==="tarik")x.p=photo;
if(editId){const i=S.tx.findIndex(y=>y.id===editId);if(i>=0){x.id=editId;x.t=S.tx[i].t;S.tx[i]=x}editId=null}else S.tx.push(x);photo="";save();draw()};
const wa=$("#wa");if(wa)wa.onclick=()=>{const r=rd(),k=f=>{const a=c.t.filter(f),fe=a.reduce((s,x)=>s+x.f,0);return a.reduce((s,x)=>s+(x.j||1),0)+" trx - "+R(a.reduce((s,x)=>s+x.n,0))+(fe?" (fee "+R(fe)+")":"")},sl=r.fisik-c.kas,st=v=>v===0?"✅ PAS":"⚠️ "+(v<0?"KURANG ":"LEBIH ")+R(Math.abs(v));
let t="*LAPORAN CLOSING KONTER*\nTanggal: "+d+"\nKasir: "+user+"\n\n*Rekap transaksi*\nTransfer: "+k(x=>isRb(x))+["TF Bank","Top up DANA","Token listrik"].map(s=>c.t.some(x=>isRb(x)&&(x.s||"TF Bank")===s)?"\n   - "+s+": "+k(y=>isRb(y)&&(y.s||"TF Bank")===s):"").join("")+(c.pinjam?"\nTF via saldo Ibu/Tigaraksa: "+k(isIbu)+" (cash disetor ke Ibu)":"")+"\nTarik tunai: "+k(x=>x.k==="tarik")+"\nPenjualan cash: "+k(x=>x.k==="jual"&&x.m==="cash")+"\nPenjualan TF/QRIS: "+k(x=>x.k==="jual"&&x.m!=="cash")+"\n\n*Kas fisik*\nModal awal: "+R(c.o.kas)+"\nKas seharusnya: "+R(c.kas)+"\nKas fisik: "+R(r.fisik)+"\nStatus: "+st(sl)+"\n\n*Saldo Rainbow*"+(c.pus?"\nTambah saldo dari pusat: "+R(c.pus):"")+"\nSeharusnya: "+R(c.saldo)+"\n";
t+=r.sa?"Aktual: "+R(r.sa)+"\nStatus: "+st(r.sa-c.saldo)+"\n":"Aktual: belum diisi\n";
if(S.stok[d]&&S.stok[d].k){const s=S.stok[d],pv=prevK(d);let pj=0,pt=0;Object.keys(PK).forEach(o=>PK[o].forEach(p=>{const j=s.p[pkey(o,p)]||0;pj+=j;pt+=j*p[1]}));
t+="\n*Stok kartu & perdana*\n"+KT.map(n=>{const r=s.k[n];return n+": akhir "+r[3]+", terjual "+Math.max(0,r[0]+r[1]-r[3])+(kwarn(n,r,pv).length?" ⚠️":"")}).join("\n")+"\n\n*Paket data*: "+pj+" terjual, "+R(pt)+"\n";
if(s.u.setoran)t+="Setoran kertas: "+R(s.u.setoran)+(S.close[d]&&S.close[d].setor!==s.u.setoran?" ⚠️ beda dengan closing app "+R(S.close[d].setor):" ✅")+"\n"}
t+="\nModal besok: "+R(r.bs)+"\n*Setor: "+R(r.fisik-r.bs)+"*"+(c.tk?"\nMasuk rekening lewat tarik tunai: "+R(c.tk)+"\n*Total setoran: "+R(r.fisik-r.bs+c.tk)+"*":"");if(c.nofoto)t+="\n\n⚠️ "+c.nofoto+" tarik tunai tanpa foto bukti";
window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")};
const sv=$("#sv");if(sv)sv.onclick=()=>{const r=rd(),sl=r.fisik-c.kas;if((sl!==0||c.nofoto)&&!sv.dataset.ok){ask((sl!==0?"⚠️ Kas "+(sl<0?"KURANG ":"LEBIH ")+R(Math.abs(sl))+". ":"")+(c.nofoto?c.nofoto+" tarik tunai tanpa bukti. ":"")+"Tetap simpan closing?",()=>{sv.dataset.ok=1;sv.onclick()});return}S.close[d]={by:user,cnt:r.cnt,receh:r.receh,fisik:r.fisik,kasExp:c.kas,sel:r.fisik-c.kas,saldoAkhir:r.sa,saldoExp:c.saldo,besok:r.bs,setor:r.fisik-r.bs,pinjam:c.pinjam||0};save();toast("Closing tersimpan ✓");tab="rw";document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t==="rw"));draw()};
upd()}
function rd(){const cnt={};let fisik=0;document.querySelectorAll(".dn").forEach(i=>{const q=num(i.value);if(q){cnt[i.dataset.v]=q;fisik+=q*i.dataset.v}});const receh=num(($("#rc")||{}).value);return{cnt,receh,fisik:fisik+receh,sa:num(($("#sa")||{}).value),bs:num(($("#bs")||{}).value)}}
function upd(){if(!$("#fis"))return;const c=calc(D()),r=rd();$("#fis").textContent=R(r.fisik);pill("#sel1",r.fisik-c.kas);if(r.sa)pill("#sel2",r.sa-c.saldo);else $("#sel2").innerHTML="";$("#stor").textContent=R(r.fisik-r.bs);if($("#tot"))$("#tot").textContent=R(r.fisik-r.bs+c.tk)}
draw();
</script></body></html>
